/* — токены: шкала 1,25 от 17px; отступы кратны 4; нейтральные с синей примесью — */
:root{
  --fon:#f4f5f7;
  --list:#ffffff;
  --tekst:#16191d;
  --tekst-2:#555d69;
  --ramka:#e0e4e9;
  --seryj-blok:#eceff3;
  --zelenyj:#15704a;
  --zheltyj:#87560a;
  --sinij:#1f5c9e;
  --krasnyj:#a12626;
  --shag:8px;
  --shrift:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --list-shirina:760px;
  --ten:0 1px 2px rgba(22,25,29,.06),0 14px 34px -18px rgba(22,25,29,.22);
  --plavno:.18s cubic-bezier(.2,.7,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;
  padding:clamp(24px,5vw,56px) clamp(16px,4vw,24px);
  background:var(--fon);
  color:var(--tekst);
  font:400 17px/1.6 var(--shrift);
  font-feature-settings:"kern" 1,"liga" 1;
  -webkit-text-size-adjust:100%;
}
#otchet{max-width:var(--list-shirina);margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance;overflow-wrap:break-word}
h1{font-size:clamp(30px,2rem+2.2vw,41px);font-weight:700;line-height:1.12;letter-spacing:-.022em}
h2{font-size:clamp(22px,1.2rem+1.4vw,26px);font-weight:700;line-height:1.22;letter-spacing:-.012em}
h3{font-size:21px;font-weight:700;line-height:1.28;letter-spacing:-.008em}
p{margin:0}
a{color:var(--sinij)}
a:focus-visible,button:focus-visible{outline:3px solid var(--sinij);outline-offset:3px;border-radius:3px}
.kartochka{
  background:var(--list);
  border:1px solid var(--ramka);
  border-radius:12px;
  padding:clamp(16px,3vw,24px);
}
.razdel{margin-top:56px}
.razdel>h2{margin-bottom:16px}
.stopka{display:flex;flex-direction:column;gap:16px}
.vtorichno{color:var(--tekst-2)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
/* — шапка, вердикт, сводка — */
.shapka{position:relative;margin-bottom:24px}
.nadpis{
  font-size:13px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:4px;
}
.shapka__adres{overflow-wrap:anywhere}
.verdikt{
  border-left:4px solid var(--zelenyj);
  box-shadow:var(--ten);
  display:flex;flex-direction:column;gap:8px;
}
.verdikt__znachok{
  color:var(--zelenyj);font-size:26px;font-weight:700;line-height:1;
}
.verdikt__poyasnenie{max-width:58ch}
.svodka{margin-top:24px;display:flex;flex-direction:column;gap:16px}
.ocenki{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ocenka{
  background:var(--list);border:1px solid var(--ramka);
  border-radius:10px;padding:12px;text-align:center;
}
.ocenka__ball{font-size:33px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.ocenka__imya{font-size:13px;line-height:1.3;color:var(--tekst-2);margin-top:4px}
.ocenka--horosho .ocenka__ball{color:var(--zelenyj)}
.ocenka--srednee .ocenka__ball{color:var(--zheltyj)}
.ocenka--ploho .ocenka__ball{color:var(--krasnyj)}
.cifry{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cifra{background:var(--seryj-blok);border-radius:10px;padding:16px}
.cifra__imya{font-size:14px}
.cifra__znachenie{font-size:26px;font-weight:700;line-height:1.2;margin:2px 0 6px;letter-spacing:-.015em}
.cifra__poyasnenie{font-size:14px;line-height:1.5;max-width:40ch}
@media (max-width:560px){
  .ocenki{grid-template-columns:1fr 1fr}
  .cifry{grid-template-columns:1fr}
}

    "Скачки вёрстки при загрузке: ни одного",
    "Работа с клавиатуры: фильтры и карточки доступны без мыши",
    "Мобильная вёрстка на ширине 360 px: горизонтальной прокрутки нет",
    "Консоль браузера: ни ошибок, ни предупреждений"
  ],
  "ne_nasha_zona": {
    "zagolovok": "Что не в зоне ответственности исполнителя",
    "tekst": "Заголовки кэширования выставляет сама площадка GitHub Pages. Lighthouse оценивает возможную экономию в 73 КБ на повторных заходах, но повлиять на это со стороны сайта нельзя — настройка живёт на стороне хостинга. На своём хостинге этот пункт решается одной строкой в настройках сервера."
  },
  "zamer": {
    "instrument": "Lighthouse",
    "versiya": "13.4.1",
    "rezhim": "мобильный режим с замедлением сети",
    "progonov": 3,
    "data": "14 сентября 2026 года"
  }
};
/* ДАННЫЕ: конец */
/* ПОСТРОЕНИЕ: начало */
const koren = document.getElementById("otchet");

function el(teg, klassy = "", tekst = "") {
  const e = document.createElement(teg);
  if (klassy) e.className = klassy;
  if (tekst) e.textContent = tekst;
  return e;
}

function razdel(zagolovok) {
  const s = el("section", "razdel");
  s.append(el("h2", "", zagolovok));
  return s;
}

function ssylka(adres, klassy = "") {
  const a = el("a", klassy);
  a.href = adres;
  a.textContent = adres;
  return a;
}

/* — шапка: кто проверен и когда — */
const shapka = el("header", "shapka");
shapka.append(el("p", "vtorichno nadpis", "Отчёт о проверке сайта перед запуском"));
shapka.append(el("p", "vtorichno", ОТЧЁТ.sajt.nazvanie));
const stroka_adresa = el("p", "vtorichno");
stroka_adresa.append(ssylka(ОТЧЁТ.sajt.adres, "shapka__adres"));
shapka.append(stroka_adresa);
koren.append(shapka);

/* — вердикт — */
const verdikt = el("div", "kartochka verdikt");
verdikt.append(
  el("p", "verdikt__znachok", "✓"),
  el("h1", "", ОТЧЁТ.verdikt.zagolovok),
  el("p", "verdikt__poyasnenie", ОТЧЁТ.verdikt.poyasnenie),
);
koren.append(verdikt);

/* — четыре оценки плашками — */
function cvet_ocenki(ball) {
  if (ball >= 90) return "ocenka--horosho";
  if (ball >= 50) return "ocenka--srednee";
  return "ocenka--ploho";
}

const svodka = el("div", "svodka");
const ocenki = el("div", "ocenki");
for (const o of ОТЧЁТ.ocenki) {
  const plashka = el("div", "ocenka " + cvet_ocenki(o.ball));
  plashka.append(
    el("p", "ocenka__ball", String(o.ball)),
    el("p", "ocenka__imya", o.imya),
  );
  ocenki.append(plashka);
}
svodka.append(ocenki);

/* — две главные цифры — */
const cifry = el("div", "cifry");
for (const m of ОТЧЁТ.metriki) {
  const c = el("div", "cifra");
  c.append(
    el("p", "cifra__imya vtorichno", m.imya),
    el("p", "cifra__znachenie", m.znachenie),
    el("p", "cifra__poyasnenie vtorichno", m.poyasnenie),
  );
  cifry.append(c);
}
svodka.append(cifry);
koren.append(svodka);
</script>

</html>
