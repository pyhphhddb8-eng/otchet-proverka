}

/* — оценки и главные цифры: таблицы, как в бумажном акте — */
function cvet_ocenki(ball) {
  if (ball >= 90) return "ball--horosho";
  if (ball >= 50) return "ball--srednee";
  return "ball--ploho";
}

const svodka = el("div", "svodka");
const [ocenki, ocenkiTelo] = tablica(`Оценки Lighthouse, замер ${ОТЧЁТ.zamery.posle.podpis}`, ["Раздел", "Балл из 100"]);
for (const o of ОТЧЁТ.ocenki) {
  const r = el("tr");
  r.append(el("td", "", o.imya), el("td", "chislo " + cvet_ocenki(o.ball), String(o.ball)));
  ocenkiTelo.append(r);
}
const [cifry, cifryTelo] = tablica("Главные цифры", ["Что", "Значение"]);
for (const m of ОТЧЁТ.metriki) {
  const r = el("tr");
  r.append(el("td", "", m.imya), el("td", "chislo", m.znachenie));
  const r2 = el("tr", "poyasnenie-stroki");
  const yach = el("td", "", m.poyasnenie);
  yach.colSpan = 2;
  r2.append(yach);
  cifryTelo.append(r, r2);
}
svodka.append(ocenki, cifry);
koren.append(svodka);

/* — было / стало — */
const paraRazdel = razdel("Было и стало");
paraRazdel.classList.add("razdel--s-novoj-stranicy");
paraRazdel.append(
  el(
    "p",
    "vtorichno podvodka",
    "Оба замера сделаны одним инструментом, в одном режиме и по медиане трёх " +
      "прогонов, поэтому их можно сравнивать.",
  ),
);
const [para, paraTelo] = tablica("Что изменилось после правок", ["Показатель", "Было", "Стало"]);
for (const p of ОТЧЁТ.bylo_stalo) {
  const r = el("tr");
  r.append(el("td", "", p.imya), el("td", "chislo bylo", p.bylo), el("td", "chislo stalo", p.stalo));
  const r2 = el("tr", "poyasnenie-stroki");
  const yach = el("td", "", p.poyasnenie);
  yach.colSpan = 3;
  r2.append(yach);
  paraTelo.append(r, r2);
}
paraRazdel.append(para);
koren.append(paraRazdel);

/* — находки — */
const chinit = razdel("Находки и что с ними стало");
chinit.append(
  el(
    "p",
    "vtorichno podvodka",
    "Порядок тот же, что в первой версии отчёта: сначала то, что сильнее " +
      "мешает посетителю. Ни один пункт не мешал запуску.",
  ),
);

const spisok_nahodok = el("div");
for (const n of ОТЧЁТ.nahodki) {
  const k = el("article", "nahodka");
  const ispravleno = n.status === "ispravleno";

  const verh = el("div", "nahodka__verh");
  verh.append(
    el("h3", "", `${n.nomer}. ${n.zagolovok}`),
    el(
      "span",
      "otmetka " + (ispravleno ? "otmetka--ispravleno" : "otmetka--ostalos"),
      ispravleno ? "исправлено" : "осталось",
    ),
  );
  k.append(verh);

  for (const [podpis, tekst] of [
    ["Что нашёл", n.chto],
    ["Чем это грозит посетителю", n.chem_grozit],
    ["Что делать", n.chto_delat],
    [ispravleno ? "Что сделано" : "Что выяснилось при починке", n.chto_sdelano],
  ]) {
    const blok = el("div", "nahodka__blok");
    blok.append(el("p", "nahodka__podpis", podpis), el("p", "", tekst));
    k.append(blok);
  }

  const niz = el("dl", "nahodka__niz");
  for (const [podpis, tekst] of [
    ["Сколько займёт", n.skolko],
    ["Справитесь сами", n.sam],
  ]) {
    niz.append(el("dt", "", podpis), el("dd", "", tekst));
  }
  k.append(niz);

  spisok_nahodok.append(k);
}
chinit.append(spisok_nahodok);
koren.append(chinit);
/* — почему SEO 63 — */
const seo = razdel(ОТЧЁТ.seo.zagolovok);
const seo_tekst = el("div", "poyasnenie");
seo_tekst.append(el("p", "", ОТЧЁТ.seo.tekst));
seo.append(seo_tekst);
koren.append(seo);

/* — проверено и в порядке — */
const porjadok = razdel("Проверено и в порядке");
porjadok.append(
  el(
    "p",
    "vtorichno podvodka",
    "Здесь перечислено то, что проверялось и замечаний не вызвало. " +
      "Так видно, насколько широко шла проверка.",
  ),
);
const spisok = el("ul", "porjadok");
for (const stroka of ОТЧЁТ.provereno) {
  spisok.append(el("li", "", stroka));
}
porjadok.append(spisok);
koren.append(porjadok);

/* — не наша зона — */
const chuzhoe = razdel(ОТЧЁТ.ne_nasha_zona.zagolovok);
const chuzhoe_tekst = el("div", "poyasnenie");
chuzhoe_tekst.append(el("p", "", ОТЧЁТ.ne_nasha_zona.tekst));
chuzhoe.append(chuzhoe_tekst);
koren.append(chuzhoe);

/* — подвал: чем мерил, когда, в каких условиях — */
const podval = el("footer", "podval");
podval.append(el("p", "podval__zagolovok", "Как проводились замеры"));
for (const klyuch of ["do", "posle"]) {
  const z = ОТЧЁТ.zamery[klyuch];
  podval.append(
    el(
      "p",
      "",
      `Замер ${z.podpis}: ${z.instrument} ${z.versiya}, ${z.rezhim}, ` +
        `медиана ${slovom(z.progonov)} прогонов, ${z.data}.`,
    ),
  );
}
const podval_sajt = el("p", "");
podval_sajt.append(
  document.createTextNode("Проверенный сайт: "),
  ssylka(ОТЧЁТ.sajt.adres),
);
podval.append(podval_sajt);
podval.append(
  el(
    "p",
    "",
    "Сырые отчёты обоих замеров сохранены, числа в документе можно сверить с ними.",
  ),
);
koren.append(podval);

/* — колонтитул: виден только в печати, повторяется на каждой странице —
   Обёртка таблицей — единственный способ заставить браузер отвести
   колонтитулу место на каждом листе. Фиксированный блок этого не умеет:
   он либо ложится поверх текста, либо уезжает на следующую страницу.
   На экране таблица выключена и ведёт себя как обычные блоки. */
const list = el("table", "pechatnyj-list");
const nizList = el("tfoot");
const nizStroka = el("tr");
const nizYacheika = el("td");
nizYacheika.append(
  el(
    "div",
    "kolontitul",
    `${ОТЧЁТ.sajt.adres} · проверка от ${ОТЧЁТ.zamery.posle.data} · версия ${ОТЧЁТ.versiya}`,
  ),
);
nizStroka.append(nizYacheika);
nizList.append(nizStroka);

const telo = el("tbody");
const teloStroka = el("tr");
const teloYacheika = el("td");
teloYacheika.append(...koren.childNodes);
teloStroka.append(teloYacheika);
telo.append(teloStroka);

list.append(nizList, telo);
koren.append(list);
/* ПОСТРОЕНИЕ: конец */
</script>
</body>
</html>
